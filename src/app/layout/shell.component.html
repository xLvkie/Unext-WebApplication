<div class="min-h-screen bg-surface">
  <header class="sticky top-0 z-30 border-b border-line bg-white">
    <div class="mx-auto flex h-16 max-w-7xl items-center gap-4 px-4">
      <a class="flex items-center gap-2" routerLink="/empleos">
        <span class="grid h-9 w-9 place-items-center rounded-xl bg-primary text-sm font-extrabold text-white">U</span>
        <span class="text-lg font-extrabold tracking-tight">UNEXT</span>
      </a>

      <nav class="flex items-center gap-1">
        <a
          class="rounded-lg px-3 py-2 text-sm font-semibold text-ink-muted"
          routerLink="/empleos"
          routerLinkActive="bg-primary-soft text-primary"
        >
          Buscar trabajo
        </a>
        <a
          class="rounded-lg px-3 py-2 text-sm font-semibold text-ink-muted"
          routerLink="/mensajes"
          routerLinkActive="bg-primary-soft text-primary"
        >
          Mensajería
        </a>
      </nav>

      <div class="ml-auto flex items-center gap-2">
        @if (auth.session()) {
          <div class="hidden text-right sm:block">
            <p class="text-sm font-semibold leading-4">{{ auth.displayName() }}</p>
            <p class="text-[11px] text-ink-muted">{{ role() }}</p>
          </div>
          <button class="btn-secondary !px-3 !py-2" type="button" (click)="logout()">Salir</button>
        } @else {
          <button class="btn-primary !px-3 !py-2" type="button" (click)="openLogin()">Ingresar</button>
        }
      </div>
    </div>
  </header>

  <main>
    <router-outlet />
  </main>
</div>

@if (loginOpen()) {
  <div class="fixed inset-0 z-40 grid place-items-center bg-ink/40 px-4">
    <form class="card w-full max-w-md p-6" (submit)="$event.preventDefault(); submit()">
      <div class="mb-5 flex items-start justify-between gap-3">
        <div>
          <p class="text-xs font-bold uppercase tracking-wide text-primary">Unext</p>
          <h2 class="mt-1 text-2xl font-extrabold">Ingresa a tu cuenta</h2>
          <p class="mt-1 text-sm text-ink-muted">Usa el mismo correo con el que te registraste en el backend.</p>
        </div>
        <button class="text-sm font-semibold text-ink-muted" type="button" (click)="loginOpen.set(false)">Cerrar</button>
      </div>

      <label class="mb-3 block text-xs font-semibold text-ink-muted">
        Correo
        <input class="field mt-1" type="email" autocomplete="username" [value]="email()" (input)="onEmail($event)" />
      </label>
      <label class="mb-3 block text-xs font-semibold text-ink-muted">
        Contraseña
        <input class="field mt-1" type="password" autocomplete="current-password" [value]="password()" (input)="onPassword($event)" />
      </label>

      @if (loginError()) {
        <p class="mb-3 rounded-lg bg-danger-soft px-3 py-2 text-sm text-danger">{{ loginError() }}</p>
      }

      <button class="btn-primary w-full" type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Ingresando…' : 'Ingresar' }}
      </button>
    </form>
  </div>
}
