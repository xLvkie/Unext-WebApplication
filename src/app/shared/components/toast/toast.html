@if (toast(); as t) {
  <div class="fixed bottom-6 right-6 z-50 animate-fade-in">
    <div
      [ngClass]="{
        'bg-[#10B981] text-white': t.type === 'success',
        'bg-[#274DEA] text-white': t.type === 'info',
        'bg-[#F59E0B] text-white': t.type === 'warning',
        'bg-[#EF4444] text-white': t.type === 'error'
      }"
      class="px-4 py-3 rounded-2xl shadow-xl flex items-center gap-3 text-[13px] font-semibold max-w-md border border-white/20"
    >
      <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      <span class="flex-1">{{ t.message }}</span>
      <button
        type="button"
        (click)="dismiss.emit()"
        class="text-white/80 hover:text-white text-xs font-bold ml-1"
      >
        ✕
      </button>
    </div>
  </div>
}
